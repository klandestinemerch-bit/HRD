<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#132420;
    --ink-soft:#3c5049;
    --muted:#6b7d76;
    --line:#dfe6e0;
    --bg:#f3f5f1;
    --panel:#ffffff;
    --panel-2:#f8f9f6;
    --emerald:#1c4a3f;
    --emerald-deep:#0e2e26;
    --emerald-soft:#e7efe9;
    --gold:#b98a2e;
    --gold-soft:#f6ecd6;
    --teal:#2f8074;
    --rose:#b1543f;
    --sky:#3f6f9c;
    --radius:14px;
    --shadow:0 1px 2px rgba(19,36,32,0.04), 0 8px 24px -12px rgba(19,36,32,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px;
    flex-shrink:0;
    background:linear-gradient(185deg, var(--emerald-deep), #0a211b 78%);
    color:#dfeee8;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:4px 6px 22px 6px;
    border-bottom:1px solid rgba(255,255,255,0.09);
    margin-bottom:18px;
  }
  .brand-mark{
    width:40px; height:40px; border-radius:10px;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-text .t1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; line-height:1.15; color:#f4f0e4;}
  .brand-text .t2{font-size:10.5px; color:#9fb8ae; letter-spacing:.06em; text-transform:uppercase; margin-top:2px;}

  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:#7d9a90; margin:14px 10px 8px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:9px; margin-bottom:2px;
    font-size:13.5px; font-weight:500; color:#c6dcd3;
    cursor:pointer; user-select:none;
    border:1px solid transparent;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:.8;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{
    background:rgba(255,255,255,0.1);
    color:#fff;
    border-color:rgba(255,255,255,0.12);
  }
  .nav-item.active svg{opacity:1;}
  .nav-badge{
    margin-left:auto; font-size:10.5px; padding:1px 7px; border-radius:20px;
    background:rgba(255,255,255,0.1); color:#dfeee8;
  }

  .sidebar-footer{
    margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,0.09);
    font-size:11px; color:#7d9a90; line-height:1.5;
  }

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:26px 34px 60px;}
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .topbar h1{font-size:22px; margin:0 0 4px; font-weight:700; letter-spacing:-.01em;}
  .topbar .sub{font-size:13px; color:var(--muted);}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .pill{
    display:flex; align-items:center; gap:7px;
    background:var(--panel); border:1px solid var(--line);
    padding:7px 13px; border-radius:100px; font-size:12.5px; color:var(--ink-soft); font-weight:500;
    box-shadow:var(--shadow);
  }
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--teal);}

  .view{display:none;}
  .view.active{display:block;}

  /* KPI cards */
  .kpi-grid{
    display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:22px;
  }
  @media (max-width:1200px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  .kpi-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .kpi-card .kpi-label{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .kpi-card .kpi-value{font-family:'Space Grotesk',sans-serif; font-size:27px; font-weight:700; margin-top:6px; color:var(--emerald-deep);}
  .kpi-card .kpi-note{font-size:11.5px; color:var(--muted); margin-top:5px;}
  .kpi-card .kpi-accent{position:absolute; right:-10px; top:-10px; width:60px; height:60px; border-radius:50%; opacity:.10;}

  /* Panels / charts */
  .grid-2{display:grid; grid-template-columns:1.1fr 1fr; gap:16px; margin-bottom:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}
  @media (max-width:980px){ .grid-2, .grid-3{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 14px; box-shadow:var(--shadow);
  }
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .panel-head h3{font-size:14.5px; margin:0; font-weight:600;}
  .panel-head .panel-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .chart-wrap{position:relative; height:230px;}
  .chart-wrap.tall{height:290px;}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line);
    white-space:nowrap; cursor:pointer; user-select:none;
  }
  th:hover{color:var(--ink);}
  th.sorted::after{content:' ↓'; color:var(--gold);}
  th.sorted-asc::after{content:' ↑'; color:var(--gold);}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr.data-row{cursor:pointer;}
  tr.data-row:hover td{background:var(--panel-2);}
  .badge{
    display:inline-block; padding:2px 9px; border-radius:100px; font-size:11px; font-weight:600;
  }
  .badge-mflash{background:#e7efe9; color:#1c4a3f;}
  .badge-holding{background:#f6ecd6; color:#8a611c;}
  .badge-reload{background:#e6eef5; color:#2c567f;}
  .badge-solution{background:#f3e6ea; color:#8a3a52;}

  /* Directory controls */
  .dir-controls{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center;
  }
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:9px 13px; flex:1; min-width:220px;
    box-shadow:var(--shadow);
  }
  .search-box svg{width:15px; height:15px; color:var(--muted); flex-shrink:0;}
  .search-box input{border:none; outline:none; font-size:13.5px; width:100%; font-family:'Inter'; background:transparent; color:var(--ink);}
  select.filter-select{
    border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px;
    background:var(--panel); color:var(--ink-soft); font-family:'Inter'; box-shadow:var(--shadow);
    max-width:180px;
  }
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:var(--shadow); font-family:'Inter';
  }
  .btn:hover{background:var(--panel-2);}
  .btn-primary{background:var(--emerald); color:#fff; border-color:var(--emerald);}
  .btn-primary:hover{background:var(--emerald-deep);}
  .btn svg{width:14px; height:14px;}

  .table-scroll{overflow-x:auto; border-radius:var(--radius);}
  .pager{display:flex; align-items:center; justify-content:space-between; margin-top:12px; font-size:12.5px; color:var(--muted);}
  .pager-btns{display:flex; gap:6px;}
  .pager-btns button{
    border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:5px 11px; cursor:pointer; font-size:12.5px; font-family:'Inter';
  }
  .pager-btns button:disabled{opacity:.4; cursor:not-allowed;}
  .pager-btns button.active{background:var(--emerald); color:#fff; border-color:var(--emerald);}

  /* Modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(14,25,22,0.55); z-index:50;
    align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--panel); border-radius:16px; width:100%; max-width:720px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.35); overflow:hidden;
  }
  .modal-head{
    background:linear-gradient(120deg, var(--emerald-deep), var(--emerald));
    color:#fff; padding:22px 26px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h2{margin:0; font-size:19px; font-weight:700;}
  .modal-head .m-sub{font-size:12.5px; color:#c6dcd3; margin-top:4px;}
  .modal-close{
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:30px; height:30px; border-radius:50%;
    cursor:pointer; font-size:16px; line-height:1; flex-shrink:0;
  }
  .modal-body{padding:22px 26px 26px; max-height:66vh; overflow-y:auto;}
  .detail-section{margin-bottom:18px;}
  .detail-section h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700;
    margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;}
  .detail-item .dl{font-size:11px; color:var(--muted); margin-bottom:2px;}
  .detail-item .dv{font-size:13.5px; color:var(--ink); font-weight:500; word-break:break-word;}

  /* Tools view */
  .tool-list{list-style:none; margin:0; padding:0;}
  .tool-list li{
    display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid var(--line);
  }
  .tool-list li:last-child{border-bottom:none;}
  .tool-avatar{
    width:34px; height:34px; border-radius:50%; background:var(--emerald-soft); color:var(--emerald-deep);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
    font-family:'Space Grotesk';
  }
  .tool-name{font-size:13.5px; font-weight:600; color:var(--ink);}
  .tool-meta{font-size:11.5px; color:var(--muted);}
  .tool-right{margin-left:auto; text-align:right;}
  .tool-tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px;}
  .tag-gold{background:var(--gold-soft); color:#8a611c;}
  .tag-teal{background:#e2f0ec; color:#1c5b4d;}
  .tag-rose{background:#f6e4de; color:#a14329;}

  .empty-state{
    text-align:center; padding:34px 20px; color:var(--muted); font-size:13px;
  }

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9d3cc; border-radius:20px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* Status badges */
  .status-badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px; font-size:11px; font-weight:700;}
  .status-badge.aktif{background:#e2f0ec; color:#1c5b4d;}
  .status-badge.aktif::before{content:''; width:6px; height:6px; border-radius:50%; background:#2f8074;}
  .status-badge.nonaktif{background:#f3e6e6; color:#9c3a3a;}
  .status-badge.nonaktif::before{content:''; width:6px; height:6px; border-radius:50%; background:#b1543f;}

  /* SP Performance */
  .sp-level-badge{ display:inline-flex; align-items:center; justify-content:center; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:700; letter-spacing:.04em; }
  .sp-1{ background:#b98a2e22; color:#b98a2e; border:1px solid #b98a2e66; }
  .sp-2{ background:#e8680022; color:#e86800; border:1px solid #e8680066; }
  .sp-3{ background:#e8222222; color:#e82222; border:1px solid #e8222266; }
  .sp-status-aktif{ background:#e8222222; color:#e82222; border:1px solid #e8222244; border-radius:6px; padding:2px 10px; font-size:11px; font-weight:700; }
  .sp-status-selesai{ background:#1c4a3f22; color:#4a7c66; border:1px solid #4a7c6644; border-radius:6px; padding:2px 10px; font-size:11px; font-weight:700; }
  .sp-month-chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; background:var(--emerald-soft); color:var(--teal); border:1px solid var(--teal); }
  .sp-month-chip.older{ background:var(--panel-2); color:var(--ink-soft); border-color:var(--line); }

  /* Employment status tabs (Direktori) */
  .status-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .status-tab{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:11px; cursor:pointer; user-select:none;
    background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
    font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .status-tab .count{
    background:var(--panel-2); padding:1px 9px; border-radius:100px; font-size:11.5px; color:var(--muted); font-weight:700;
  }
  .status-tab.active{background:var(--emerald); border-color:var(--emerald); color:#fff;}
  .status-tab.active .count{background:rgba(255,255,255,0.18); color:#fff;}
  .status-tab.nonaktif-tab.active{background:var(--rose); border-color:var(--rose);}

  .btn-sm{padding:5px 11px; font-size:12px; border-radius:8px;}
  .btn-danger{background:#f6e4de; border-color:#f0d3c8; color:#a14329;}
  .btn-danger:hover{background:#f0d3c8;}
  .btn-success{background:#e2f0ec; border-color:#c9e6dc; color:#1c5b4d;}
  .btn-success:hover{background:#c9e6dc;}

  /* Input Karyawan form */
  .form-section{margin-bottom:22px;}
  .form-section h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700;
    margin:0 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 20px;}
  @media (max-width:760px){ .form-grid{grid-template-columns:1fr;} }
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field.span-2{grid-column:1/-1;}
  .form-field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .form-field label .req{color:var(--rose);}
  .form-field input, .form-field select, .form-field textarea{
    border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:13.5px;
    font-family:'Inter'; background:var(--panel-2); color:var(--ink); outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{
    border-color:var(--emerald); background:#fff;
  }
  .form-field textarea{resize:vertical; min-height:56px;}
  .form-actions{display:flex; gap:10px; align-items:center; margin-top:6px;}
  .form-hint{font-size:11.5px; color:var(--muted);}
  .toast{
    display:none; align-items:center; gap:10px; padding:12px 16px; border-radius:11px; margin-bottom:18px;
    background:#e2f0ec; color:#1c5b4d; font-size:13.5px; font-weight:600; border:1px solid #c9e6dc;
  }
  .toast.show{display:flex;}
  .toast svg{width:17px; height:17px; flex-shrink:0;}

  .banner-warn{
    display:flex; gap:10px; align-items:flex-start; background:#fbf3e2; border:1px solid #f0e0b8; color:#7a5c14;
    padding:11px 14px; border-radius:11px; font-size:12.5px; margin-bottom:16px;
  }

  /* ---------- Login ---------- */
  #loginOverlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 20%, #163d33, #081a15 70%);
    padding:20px;
  }
  .login-card{
    width:100%; max-width:400px; background:var(--panel); border-radius:18px; padding:32px 30px 28px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.5);
  }
  .login-brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px;}
  .login-brand .brand-mark{width:100px; height:100px; font-size:20px; margin-bottom:12px; background:transparent;}
  .login-brand h1{font-size:18px; margin:0 0 3px;}
  .login-brand p{font-size:12.5px; color:var(--muted); margin:0;}
  .role-toggle{display:flex; gap:8px; margin-bottom:18px; background:var(--panel-2); padding:4px; border-radius:11px;}
  .role-btn{
    flex:1; text-align:center; padding:9px 0; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
    color:var(--muted); user-select:none;
  }
  .role-btn.active{background:var(--panel); color:var(--emerald-deep); box-shadow:var(--shadow);}
  .login-field{margin-bottom:14px;}
  .login-field label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .login-field input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:13.5px;
    font-family:'Inter'; background:var(--panel-2); outline:none;
  }
  .login-field input:focus{border-color:var(--emerald); background:#fff;}
  .login-error{font-size:12.5px; color:var(--rose); margin:-6px 0 14px; display:none;}
  .login-error.show{display:block;}
  .login-hint{font-size:11px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.5;}
  .btn-block{width:100%; justify-content:center;}

  /* ---------- Role / topbar user chip ---------- */
  .role-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px;
  }
  .role-chip.admin{background:var(--gold-soft); color:#8a611c;}
  .role-chip.user{background:#e6eef5; color:#2c567f;}
  .user-box{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:11px; background:rgba(255,255,255,0.05);
    margin-bottom:10px;
  }
  .user-avatar{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.14); color:#f4f0e4;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0;
    font-family:'Space Grotesk';
  }
  .user-info .u-name{font-size:12.5px; font-weight:600; color:#f4f0e4;}
  .user-info .u-role{font-size:10.5px; color:#9fb8ae; text-transform:uppercase; letter-spacing:.04em;}
  .logout-btn{
    display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
    padding:8px 0; border-radius:9px; background:rgba(177,84,63,0.18); color:#f3c9bc; border:1px solid rgba(177,84,63,0.3);
    font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter';
  }
  .logout-btn:hover{background:rgba(177,84,63,0.28);}
  .logout-btn svg{width:14px; height:14px;}

  /* ---------- Settings ---------- */
  .theme-grid{display:flex; gap:12px; flex-wrap:wrap;}
  .theme-swatch{
    width:84px; cursor:pointer; border-radius:12px; padding:10px; border:2px solid var(--line); text-align:center;
    background:var(--panel-2);
  }
  .theme-swatch.selected{border-color:var(--emerald); box-shadow:0 0 0 3px var(--emerald-soft);}
  .theme-swatch .sw-dots{display:flex; gap:4px; justify-content:center; margin-bottom:8px;}
  .theme-swatch .sw-dot{width:16px; height:16px; border-radius:50%;}
  .theme-swatch .sw-label{font-size:10.5px; font-weight:600; color:var(--ink-soft);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .tr-label{font-size:13.5px; font-weight:600; color:var(--ink);}
  .toggle-row .tr-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .switch{position:relative; width:42px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; inset:0; background:#c7d0ca; border-radius:100px; cursor:pointer; transition:.2s;}
  .switch .slider::before{content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:var(--emerald);}
  .switch input:checked + .slider::before{transform:translateX(18px);}
  .switch input:disabled + .slider{opacity:.5; cursor:not-allowed;}
  .row-avatar{width:28px; height:28px; border-radius:50%; object-fit:cover; flex:none; border:1px solid var(--line);}
  .salary-filter-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .row-avatar-fallback{
    display:flex; align-items:center; justify-content:center; background:var(--gold-soft, #f0e3c8);
    color:var(--gold-deep, #8a6a1a); font-size:11px; font-weight:700;
  }
  .wa-link{
    display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%;
    color:#25D366; background:rgba(37,211,102,.12); flex:none; transition:transform .12s ease;
  }
  .wa-link:hover{ transform:scale(1.12); background:rgba(37,211,102,.22); }
  .photo-upload-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .photo-preview{
    width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--panel-2, #f4f4f2);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--muted); flex:none;
  }
  .modal-avatar{width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.5); flex:none;}
  .modal-avatar-fallback{
    display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.15); color:#fff; font-weight:700; font-size:16px;
  }
  .status-switch-wrap{display:flex; align-items:center; gap:8px;}
  .switch.status-switch input:not(:checked) + .slider{background:#c98a7a;}
  .switch.status-switch .slider::before{box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .status-switch-label{font-size:11.5px; font-weight:600; color:var(--muted);}
  .status-switch-label.on{color:var(--teal);}
  .status-switch-label.off{color:var(--rose);}

  /* Branch transfer history */
  .history-timeline{list-style:none; margin:0; padding:0;}
  .history-timeline li{
    position:relative; padding:0 0 16px 22px; border-left:2px solid var(--line); margin-left:5px;
  }
  .history-timeline li:last-child{border-left-color:transparent; padding-bottom:0;}
  .history-timeline li::before{
    content:''; position:absolute; left:-6px; top:2px; width:10px; height:10px; border-radius:50%;
    background:var(--gold); border:2px solid var(--panel);
  }
  .history-date{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .history-move{font-size:13px; margin-top:2px; color:var(--ink);}
  .history-move .loc-from{color:var(--muted); text-decoration:line-through;}
  .history-move .loc-to{color:var(--emerald-deep); font-weight:700;}
  .history-note{font-size:12px; color:var(--muted); margin-top:2px;}
  .history-add-form{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px 12px; align-items:end;
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); min-width:0;
  }
  .history-add-form .form-field{margin-bottom:0; min-width:0;}
  .history-add-form .form-field input,
  .history-add-form .form-field select{width:100%; min-width:0; box-sizing:border-box;}
  .history-add-form > button, .history-add-form > div > button{white-space:nowrap;}
  @media (max-width:640px){ .history-add-form{grid-template-columns:1fr;} }
  fieldset.settings-fieldset{border:none; margin:0; padding:0;}
  fieldset.settings-fieldset:disabled{opacity:.55;}
  .admin-only-note{
    display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); background:var(--panel-2);
    border:1px dashed var(--line); border-radius:10px; padding:9px 12px; margin-bottom:14px;
  }

  /* ---------- Dark mode ---------- */
  body.dark{ --ink:#eef3ef; --ink-soft:#c3d1ca; --muted:#8ba398; --line:#22352d; --bg:#0e1a16; --panel:#14251f; --panel-2:#0f1e19; }
  body.dark .kpi-value{color:#f2f7f4;}
  body.dark .modal-body{background:var(--panel);}
  body.dark th{color:var(--muted);}
  body.dark .search-box input, body.dark .form-field input, body.dark .form-field select, body.dark .form-field textarea{color:#eef3ef;}
</style>
</head>
<body>
<div id="loginOverlay">

<script>
/* ============ Data & helpers ============ */
const RAW = JSON.parse(document.getElementById('employee-data').textContent);
const TODAY = new Date('2026-07-21T00:00:00');
const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BASE_MAX_ID = Math.max(...RAW.map(e => e.id));
const DEFAULT_ADMIN_PASSWORD = 'admin123';

let storageOK = true; // becomes false if window.storage is unavailable/fails

function transform(e) {
  const bd = e.tanggal_lahir ? new Date(e.tanggal_lahir + 'T00:00:00') : null;
  const jd = e.tanggal_gabung ? new Date(e.tanggal_gabung + 'T00:00:00') : null;
  const masaKerjaHari = jd ? Math.round((TODAY - jd) / 86400000) : null;
  let ageCalc = null;
  if (bd) {
    ageCalc = TODAY.getFullYear() - bd.getFullYear();
    if (TODAY.getMonth() < bd.getMonth() || (TODAY.getMonth() === bd.getMonth() && TODAY.getDate() < bd.getDate())) ageCalc--;
  }
  return {
    ...e,
    status: e.status || 'Aktif',
    _bd: bd,
    _jd: jd,
    usia: bd ? ageCalc : (e.usia ?? null),
    masa_kerja_hari: jd ? masaKerjaHari : (e.masa_kerja_hari ?? null),
    tenureYears: (jd ? masaKerjaHari : e.masa_kerja_hari) != null ? (jd ? masaKerjaHari : e.masa_kerja_hari) / 365.25 : null,
  };
}

let EMP = [];                // working in-memory dataset (base + added), reactive
let statusOverrides = {};    // {id: 'Aktif'|'Non Aktif'} for base (uploaded) employees
let fieldOverrides = {};     // {id: {field: newValue, ...}} edits to base employees
let addedEmployees = [];     // full records created via "Input Karyawan"
let locationHistory = {};    // {id: [{tanggal:'YYYY-MM-DD', dari, ke, catatan}, ...]} riwayat perpindahan cabang/lokasi
let salaryHistory = {};      // {id: [{tanggal, jenis, nominal, catatan}, ...]} monitoring gaji per karyawan
const SALARY_TYPES = ['Pertambahan Gaji', 'Perubahan Gaji', 'Pengurangan Gaji', 'Tambahan Lain-lain'];
let assetInventory = {};     // {id: [{tanggal, nama_aset, kategori, kondisi, status, catatan}, ...]} aset yang dipegang karyawan
const ASSET_CATEGORIES = ['Elektronik', 'Kendaraan', 'Seragam/APD', 'Perlengkapan Kerja', 'Lainnya'];
const ASSET_STATUSES = ['Digunakan', 'Dikembalikan', 'Hilang/Rusak'];
let bagiHasil = {};          // {id: [{tanggal, lokasi, omzet, persentase, nominal, catatan}, ...]} bagi hasil per karyawan/cabang
let spRecords = [];          // [{rid, tanggal, emp_id, nama, divisi, level, alasan, diberikan_oleh, berlaku_sd, status, lampiran_count}]
let adminPassword = DEFAULT_ADMIN_PASSWORD;
let settings = {
  theme: 'emerald',
  darkMode: false,
  brandName: 'Madinah Group',
  brandSub: 'HR Monitoring',
  pageSize: 15,
};

function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
}
function fmtTenure(years) {
  if (years == null) return '—';
  const y = Math.floor(years);
  const m = Math.round((years - y) * 12);
  if (y <= 0) return `${m} bln`;
  if (m === 0) return `${y} thn`;
  return `${y} thn ${m} bln`;
}
function unitClass(divisi) {
  const d = (divisi || '').toLowerCase();
  if (d.includes('reload')) return 'badge-reload';
  if (d.includes('solution')) return 'badge-solution';
  if (d.includes('holding')) return 'badge-holding';
  return 'badge-mflash';
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isAdmin() { return state.role === 'admin'; }

/* ============ Persistence (shared across everyone who opens this dashboard) ============ */
async function storageGet(key, fallback) {
  try {
    const r = await window.storage.get(key, true);
    return r && r.value ? JSON.parse(r.value) : fallback;
  } catch (err) { return fallback; }
}
async function storageSet(key, value) {
  try {
    const ok = await window.storage.set(key, JSON.stringify(value), true);
    if (!ok) storageOK = false;
    return ok;
  } catch (err) { storageOK = false; return null; }
}

async function loadPersisted() {
  statusOverrides = await storageGet('status-overrides', {});
  fieldOverrides = await storageGet('field-overrides', {});
  addedEmployees = await storageGet('added-employees', []);
  locationHistory = await storageGet('location-history', {});
  salaryHistory = await storageGet('salary-history', {});
  assetInventory = await storageGet('asset-inventory', {});
  bagiHasil = await storageGet('bagi-hasil', {});
  spRecords = await storageGet('sp-records', []);
  adminPassword = (await storageGet('admin-password', { v: DEFAULT_ADMIN_PASSWORD })).v || DEFAULT_ADMIN_PASSWORD;
  settings = { ...settings, ...(await storageGet('app-settings', {})) };
  rebuildEMP();
  applyTheme();
}

function rebuildEMP() {
  const base = RAW.map(e => transform({
    ...e,
    ...(fieldOverrides[e.id] || {}),
    status: statusOverrides[e.id] || 'Aktif',
  }));
  const added = addedEmployees.map(e => transform(e));
  EMP = base.concat(added);
}

async function persistStatusOverrides() { await storageSet('status-overrides', statusOverrides); }
async function persistFieldOverrides() { await storageSet('field-overrides', fieldOverrides); }
async function persistAddedEmployees() { await storageSet('added-employees', addedEmployees); }
async function persistSettings() { await storageSet('app-settings', settings); }
async function persistAdminPassword() { await storageSet('admin-password', { v: adminPassword }); }
async function persistSPRecords() { await storageSet('sp-records', spRecords); }
async function persistLocationHistory() { await storageSet('location-history', locationHistory); }
async function persistSalaryHistory() { await storageSet('salary-history', salaryHistory); }

function getLocationHistory(id) {
  return (locationHistory[id] || []).slice().sort((a, b) => (a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : 0));
}
async function addLocationHistoryEntry(id, entry) {
  if (!isAdmin()) return;
  if (!locationHistory[id]) locationHistory[id] = [];
  locationHistory[id].push(entry);
  await persistLocationHistory();
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

async function addSalaryRecord(id, entry) {
  if (!isAdmin()) return;
  if (!salaryHistory[id]) salaryHistory[id] = [];
  salaryHistory[id].push({ ...entry, rid: genId() });
  await persistSalaryHistory();
}
async function editSalaryRecord(id, rid, updatedFields) {
  if (!isAdmin()) return;
  const arr = salaryHistory[id] || [];
  const rec = arr.find(r => r.rid === rid);
  if (rec) Object.assign(rec, updatedFields);
  await persistSalaryHistory();
}
async function deleteSalaryRecord(id, rid) {
  if (!isAdmin()) return;
  if (!salaryHistory[id]) return;
  salaryHistory[id] = salaryHistory[id].filter(r => r.rid !== rid);
  await persistSalaryHistory();
}
function getAllSalaryRecords(jenisFilter) {
  const rows = [];
  Object.keys(salaryHistory).forEach(idStr => {
    const id = Number(idStr);
    const emp = EMP.find(x => x.id === id);
    (salaryHistory[id] || []).forEach(r => rows.push({ ...r, id, nama: emp ? emp.nama : `(ID ${id})`, lokasi: emp ? emp.lokasi : '—' }));
  });
  const filtered = jenisFilter ? rows.filter(r => r.jenis === jenisFilter) : rows;
  return filtered.sort((a, b) => (a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : 0));
}
function fmtRupiah(n) {
  const num = Number(n) || 0;
  return 'Rp' + num.toLocaleString('id-ID');
}
function salaryTypeClass(jenis) {
  if (jenis === 'Pertambahan Gaji') return 'tag-teal';
  if (jenis === 'Perubahan Gaji') return 'tag-gold';
  if (jenis === 'Pengurangan Gaji') return 'tag-rose';
  return 'tag-gold';
}

async function persistAssetInventory() { await storageSet('asset-inventory', assetInventory); }
async function addAssetRecord(id, entry) {
  if (!isAdmin()) return;
  if (!assetInventory[id]) assetInventory[id] = [];
  assetInventory[id].push({ ...entry, rid: genId() });
  await persistAssetInventory();
}
async function editAssetRecord(id, rid, updatedFields) {
  if (!isAdmin()) return;
  const arr = assetInventory[id] || [];
  const rec = arr.find(r => r.rid === rid);
  if (rec) Object.assign(rec, updatedFields);

}
async function deleteAssetRecord(id, rid) {
  if (!isAdmin()) return;
  if (!assetInventory[id]) return;
  assetInventory[id] = assetInventory[id].filter(r => r.rid !== rid);
  await persistAssetInventory();
}
function getAllAssetRecords(statusFilter) {
  const rows = [];
  Object.keys(assetInventory).forEach(idStr => {
    const id = Number(idStr);
    const emp = EMP.find(x => x.id === id);
    (assetInventory[id] || []).forEach(r => rows.push({ ...r, id, nama: emp ? emp.nama : `(ID ${id})`, lokasi: emp ? emp.lokasi : '—' }));
  });
  const filtered = statusFilter ? rows.filter(r => r.status === statusFilter) : rows;
  return filtered.sort((a, b) => (a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : 0));
}
function assetStatusClass(status) {
  if (status === 'Digunakan') return 'tag-teal';
  if (status === 'Dikembalikan') return 'tag-gold';
  return 'tag-rose';
}

async function persistBagiHasil() { await storageSet('bagi-hasil', bagiHasil); }
async function addBagiHasilRecord(id, entry) {
  if (!isAdmin()) return;
  if (!bagiHasil[id]) bagiHasil[id] = [];
  bagiHasil[id].push({ ...entry, rid: genId() });
  await persistBagiHasil();
}
async function editBagiHasilRecord(id, rid, updatedFields) {
  if (!isAdmin()) return;
  const arr = bagiHasil[id] || [];
  const rec = arr.find(r => r.rid === rid);
  if (rec) Object.assign(rec, updatedFields);
  await persistBagiHasil();
}
async function deleteBagiHasilRecord(id, rid) {
  if (!isAdmin()) return;
  if (!bagiHasil[id]) return;
  bagiHasil[id] = bagiHasil[id].filter(r => r.rid !== rid);
  await persistBagiHasil();
}
function getAllBagiHasilRecords() {
  const rows = [];
  Object.keys(bagiHasil).forEach(idStr => {
    const id = Number(idStr);
    const emp = EMP.find(x => x.id === id);
    (bagiHasil[id] || []).forEach(r => rows.push({ ...r, id, nama: emp ? emp.nama : `(ID ${id})`, lokasi: emp ? emp.lokasi : '—' }));
  });
  return rows.sort((a, b) => (a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : 0));
}

async function setLokasiSilently(id, newLokasi) {
  if (id <= BASE_MAX_ID) {
    fieldOverrides[id] = { ...(fieldOverrides[id] || {}), lokasi: newLokasi };
    await persistFieldOverrides();
  } else {
    const a = addedEmployees.find(x => x.id === id);
    if (a) a.lokasi = newLokasi;
    await persistAddedEmployees();
  }
  rebuildEMP();
}
async function syncLokasiFromHistory(id) {
  const latest = getLocationHistory(id)[0];
  const rec = EMP.find(x => x.id === id);
  if (latest && rec && latest.ke && latest.ke !== rec.lokasi) {
    await setLokasiSilently(id, latest.ke);
  }
}

async function setStatus(id, newStatus) {
  if (!isAdmin()) return;
  const rec = EMP.find(x => x.id === id);
  if (!rec) return;
  rec.status = newStatus;
  if (id <= BASE_MAX_ID) {
    statusOverrides[id] = newStatus;
    await persistStatusOverrides();
  } else {
    const a = addedEmployees.find(x => x.id === id);
    if (a) a.status = newStatus;
    await persistAddedEmployees();
  }
  render();
}

async function addEmployee(record) {
  if (!isAdmin()) return null;
  const nextId = Math.max(BASE_MAX_ID, ...EMP.map(e => e.id), BASE_MAX_ID) + 1 + addedEmployees.length;
  const full = { ...record, id: nextId, sumber: 'Input Manual', status: 'Aktif' };
  addedEmployees.push(full);
  await persistAddedEmployees();
  rebuildEMP();
  return full;
}

async function editEmployee(id, updatedFields) {
  if (!isAdmin()) return null;
  const before = EMP.find(x => x.id === id);
  const oldLokasi = before ? before.lokasi : null;

  if (id <= BASE_MAX_ID) {
    fieldOverrides[id] = { ...(fieldOverrides[id] || {}), ...updatedFields };
    await persistFieldOverrides();
  } else {
    const a = addedEmployees.find(x => x.id === id);
    if (a) Object.assign(a, updatedFields);
    await persistAddedEmployees();
  }

  if (oldLokasi && updatedFields.lokasi && updatedFields.lokasi !== oldLokasi) {
    await addLocationHistoryEntry(id, {
      tanggal: new Date().toISOString().slice(0, 10),
      dari: oldLokasi,
      ke: updatedFields.lokasi,
      catatan: 'Tercatat otomatis saat data karyawan diperbarui',
    });
  }

  rebuildEMP();
  return EMP.find(x => x.id === id);
}

/* ============ Theme ============ */
const THEMES = {
  emerald: { name: 'Emerald', primary: '#1c4a3f', primaryDeep: '#0e2e26', primarySoft: '#e7efe9', accent: '#b98a2e' },
  navy:    { name: 'Navy',    primary: '#1e3a5f', primaryDeep: '#122540', primarySoft: '#e6edf5', accent: '#c9973f' },
  maroon:  { name: 'Maroon',  primary: '#6b2737', primaryDeep: '#3e1620', primarySoft: '#f3e4e7', accent: '#b98a2e' },
  slate:   { name: 'Slate',   primary: '#39505c', primaryDeep: '#20323a', primarySoft: '#e7edef', accent: '#8a6f9c' },
  forest:  { name: 'Forest',  primary: '#2f5233', primaryDeep: '#1a301d', primarySoft: '#e6ede6', accent: '#c98a3d' },
};

function applyTheme() {
  const t = THEMES[settings.theme] || THEMES.emerald;
  let styleEl = document.getElementById('theme-override');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'theme-override';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `:root{
    --emerald:${t.primary}; --emerald-deep:${t.primaryDeep}; --emerald-soft:${t.primarySoft}; --gold:${t.accent};
  }`;
  document.body.classList.toggle('dark', !!settings.darkMode);
}

/* ============ Auth ============ */

function setupLogin() {
  const roleBtnUser = document.getElementById('roleBtnUser');
  const roleBtnAdmin = document.getElementById('roleBtnAdmin');
  const passwordField = document.getElementById('passwordField');
  let selectedRole = 'user';

  roleBtnUser.onclick = () => {
    selectedRole = 'user';
    roleBtnUser.classList.add('active'); roleBtnAdmin.classList.remove('active');
    passwordField.style.display = 'none';
    document.getElementById('loginError').classList.remove('show');
  };
  roleBtnAdmin.onclick = () => {
    selectedRole = 'admin';
    roleBtnAdmin.classList.add('active'); roleBtnUser.classList.remove('active');
    passwordField.style.display = 'block';
    document.getElementById('loginError').classList.remove('show');
  };

  document.getElementById('loginForm').onsubmit = (ev) => {
    ev.preventDefault();
    const errEl = document.getElementById('loginError');
    if (selectedRole === 'admin') {
      const pw = document.getElementById('loginPassword').value;
      if (pw !== adminPassword) {
        errEl.textContent = 'Password admin salah. Silakan coba lagi.';
        errEl.classList.add('show');
        return;
      }
    }
    errEl.classList.remove('show');
    state.role = selectedRole;
    state.username = selectedRole === 'admin' ? 'Admin' : 'Pengguna';
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    state.view = 'overview';
    render();
  };
}

function logout() {
  if (!confirm('Yakin ingin keluar dari dashboard?')) return;
  state.role = null;
  state.username = '';
  state.view = 'overview';
  document.getElementById('loginForm').reset();
  document.getElementById('roleBtnUser').click();
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

/* ============ Overview computations ============ */
function computeOverview() {
  const active = EMP.filter(e => e.status === 'Aktif');
  const nonActiveCount = EMP.length - active.length;
  const byDivisi = {}, byLokasi = {}, byJabatan = {}, byStatus = {}, byPendidikan = {};
  let ageSum = 0, ageN = 0, tenureSum = 0, tenureN = 0;
  const ageBins = { '<20':0, '20-29':0, '30-39':0, '40-49':0, '50+':0 };
  const joinYear = {};
  let newHires90 = 0;
  let birthdaysThisMonth = [];
  let anniversariesThisMonth = [];

  active.forEach(e => {
    byDivisi[e.divisi] = (byDivisi[e.divisi]||0) + 1;
    byLokasi[e.lokasi] = (byLokasi[e.lokasi]||0) + 1;
    byJabatan[e.jabatan] = (byJabatan[e.jabatan]||0) + 1;
    byStatus[e.status_nikah] = (byStatus[e.status_nikah]||0) + 1;
    byPendidikan[e.pendidikan] = (byPendidikan[e.pendidikan]||0) + 1;
    if (e.usia != null) {
      ageSum += e.usia; ageN++;
      if (e.usia < 20) ageBins['<20']++;
      else if (e.usia < 30) ageBins['20-29']++;
      else if (e.usia < 40) ageBins['30-39']++;
      else if (e.usia < 50) ageBins['40-49']++;
      else ageBins['50+']++;
    }
    if (e.tenureYears != null) { tenureSum += e.tenureYears; tenureN++; }
    if (e._jd) {
      const y = e._jd.getFullYear();
      joinYear[y] = (joinYear[y]||0) + 1;
      if (e.masa_kerja_hari <= 90) newHires90++;
      if (e._jd.getMonth() === TODAY.getMonth()) anniversariesThisMonth.push(e);
    }
    if (e._bd && e._bd.getMonth() === TODAY.getMonth()) birthdaysThisMonth.push(e);
  });

  return {
    total: active.length,
    nonActiveCount,
    unitCount: Object.keys(byDivisi).length,
    avgAge: ageN ? (ageSum/ageN) : 0,
    avgTenure: tenureN ? (tenureSum/tenureN) : 0,
    newHires90,
    birthdaysThisMonth: birthdaysThisMonth.sort((a,b) => a._bd.getDate() - b._bd.getDate()),
    anniversariesThisMonth: anniversariesThisMonth.sort((a,b) => a._jd.getDate() - b._jd.getDate()),
    byDivisi, byLokasi, byJabatan, byStatus, byPendidikan, ageBins, joinYear,
  };
}

/* ============ Directory view ============ */
function uniqueSorted(arr) { return [...new Set(arr)].filter(Boolean).sort(); }

function getFiltered() {
  const q = state.search.trim().toLowerCase();
  let rows = EMP.filter(e => {
    if (e.status !== state.empStatus) return false;
    if (state.fDivisi && e.divisi !== state.fDivisi) return false;
    if (state.fLokasi && e.lokasi !== state.fLokasi) return false;
    if (state.fJabatan && e.jabatan !== state.fJabatan) return false;
    if (state.fStatus && e.status_nikah !== state.fStatus) return false;
    if (q) {
      const hay = `${e.nama} ${e.nik} ${e.email} ${e.no_wa} ${e.jabatan} ${e.lokasi}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  rows.sort((a, b) => {
    let va = a[state.sortKey], vb = b[state.sortKey];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'string') { va = va.toLowerCase(); vb = String(vb).toLowerCase(); }
    let cmp = va > vb ? 1 : va < vb ? -1 : 0;
    return state.sortDir === 'asc' ? cmp : -cmp;
  });
  return rows;
}

function renderDirTable() {
  const wrap = document.getElementById('dirTableWrap');
  const rows = getFiltered();
  const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const startIdx = (state.page - 1) * state.pageSize;
  const pageRows = rows.slice(startIdx, startIdx + state.pageSize);
  const extraCols = isAdmin() ? '<th>Status</th><th>Aksi</th>' : '<th>Status</th>';

  wrap.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr>
          ${DIR_COLUMNS.map(c => `<th data-key="${c.key}" class="${state.sortKey===c.key ? (state.sortDir==='asc'?'sorted-asc':'sorted') : ''}">${c.label}</th>`).join('')}
          ${extraCols}
        </tr></thead>
        <tbody>
          ${pageRows.length ? pageRows.map(rowHtml).join('') : `<tr><td colspan="${DIR_COLUMNS.length + (isAdmin()?2:1)}"><div class="empty-state">Tidak ada karyawan ${state.empStatus==='Aktif'?'aktif':'non aktif'} yang cocok dengan pencarian/filter.</div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="pager">
      <div>Menampilkan ${rows.length ? startIdx+1 : 0}–${Math.min(startIdx+state.pageSize, rows.length)} dari ${rows.length} karyawan</div>
      <div class="pager-btns">
        <button id="prevPage" ${state.page<=1?'disabled':''}>‹ Sebelumnya</button>
        <button class="active">${state.page} / ${totalPages}</button>
        <button id="nextPage" ${state.page>=totalPages?'disabled':''}>Berikutnya ›</button>
      </div>
    </div>
  `;

  wrap.querySelectorAll('th[data-key]').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = 'asc'; }
      renderDirTable();
    };
  });
  wrap.querySelectorAll('tr.data-row').forEach(tr => {
    tr.onclick = (ev) => { if (ev.target.closest('button') || ev.target.closest('label.switch')) return; openDetail(Number(tr.dataset.id)); };
  });
  wrap.querySelectorAll('input[data-status-toggle]').forEach(inp => {
    inp.onclick = (ev) => ev.stopPropagation();
    inp.onchange = (ev) => {
      ev.stopPropagation();
      const id = Number(inp.dataset.statusToggle);
      const newStatus = inp.checked ? 'Aktif' : 'Non Aktif';
      if (!confirm(newStatus === 'Non Aktif' ? 'Nonaktifkan karyawan ini?' : 'Aktifkan kembali karyawan ini?')) {
        inp.checked = !inp.checked;
        return;
      }
      setStatus(id, newStatus);
    };
  });
  wrap.querySelectorAll('button[data-edit]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      state.editId = Number(btn.dataset.edit);
      state.view = 'input';
      render();
    };
  });
  const prev = document.getElementById('prevPage');
  const next = document.getElementById('nextPage');
  if (prev) prev.onclick = () => { state.page--; renderDirTable(); };
  if (next) next.onclick = () => { state.page++; renderDirTable(); };
}

function exportCSV() {
  const rows = getFiltered();
  const headers = ['Nama','Unit','Lokasi Kerja','Jabatan','Usia','Tanggal Lahir','Tanggal Bergabung','Masa Kerja (thn)','No WhatsApp','Email','NIK','Status Pernikahan','Pendidikan','Kota','Status Karyawan'];
  const lines = [headers.join(',')];
  rows.forEach(e => {
    const vals = [e.nama, e.divisi, e.lokasi, e.jabatan, e.usia, e.tanggal_lahir, e.tanggal_gabung, e.tenureYears?.toFixed(2), e.no_wa, e.email, e.nik, e.status_nikah, e.pendidikan, e.kota, e.status];
    lines.push(vals.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob(["\uFEFF" + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `direktori-karyawan-${state.empStatus === 'Aktif' ? 'aktif' : 'nonaktif'}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const s = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i], next = s[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function normalizeDateStr(v) {
  if (!v) return '';
  v = v.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return v;
}

async function importCSV(text) {
  if (!isAdmin()) return;
  let rows;
  try { rows = parseCSV(text); } catch (err) { alert('Gagal membaca file CSV.'); return; }
  if (rows.length < 2) { alert('File CSV kosong atau tidak memiliki data.'); return; }
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = (...names) => { for (const n of names) { const i = header.indexOf(n); if (i !== -1) return i; } return -1;};
  const col = {
    nama: idx('nama'),
    divisi: idx('unit', 'divisi'),
    lokasi: idx('lokasi kerja', 'lokasi'),
    jabatan: idx('jabatan'),
    tanggal_lahir: idx('tanggal lahir'),
    tanggal_gabung: idx('tanggal bergabung', 'tanggal gabung'),
    no_wa: idx('no whatsapp', 'no. whatsapp', 'whatsapp'),
    email: idx('email'),
    nik: idx('nik'),
    status_nikah: idx('status pernikahan', 'status nikah'),
    pendidikan: idx('pendidikan'),
    kota: idx('kota'),
  };
  if (col.nama === -1) {
    alert('Kolom "Nama" wajib ada di file CSV. Pastikan header sesuai format Ekspor CSV.');
    return;
  }
  let success = 0, skipped = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const get = (i2) => (i2 === -1 ? '' : (r[i2] || '').trim());
    const nama = get(col.nama);
    if (!nama) { skipped++; continue; }
    const record = {
      nama,
      divisi: get(col.divisi) || 'M Flash',
      lokasi: get(col.lokasi),
      jabatan: get(col.jabatan),
      no_wa: get(col.no_wa),
      nik: get(col.nik),
      alamat_ktp: '', alamat_domisili: '',
      tempat_lahir: '',
      tanggal_lahir: normalizeDateStr(get(col.tanggal_lahir)),
      tanggal_gabung: normalizeDateStr(get(col.tanggal_gabung)) || TODAY.toISOString().slice(0,10),
      status_nikah: get(col.status_nikah) || 'Belum Menikah',
      jml_anak: '0',
      pendidikan: get(col.pendidikan),
      no_rekening: '', nama_rekening: '', bank: '',
      nip: '', institusi: '',
      email: get(col.email),
      kota: get(col.kota),
      kecamatan: '', kelurahan: '',
      emergency_nama: '', emergency_wa: '', emergency_hubungan: '',
      nama_bapak: '', nama_ibu: '',
      foto: '',
    };
    await addEmployee(record);
    success++;
  }
  renderSidebar();
  renderDirectory();
  alert(`Impor selesai: ${success} karyawan berhasil ditambahkan${skipped ? `, ${skipped} baris dilewati (nama kosong)` : ''}.`);
}

        ev.preventDefault();
        const fd = new FormData(ev.target);
        await addLocationHistoryEntry(id, {
          tanggal: fd.get('tanggal'),
          dari: fd.get('dari').trim(),
          ke: fd.get('ke').trim(),
          catatan: fd.get('catatan').trim(),
        });
        await syncLokasiFromHistory(id);
        openDetail(id);
      };
    }
  }
  document.getElementById('modalOverlay').classList.add('active');
}
function detailItem(label, value) {
  return `<div class="detail-item"><div class="dl">${escapeHtml(label)}</div><div class="dv">${escapeHtml(value) || '—'}</div></div>`;
}

function historyTimelineHtml(entries) {
  if (!entries.length) return `<div class="empty-state">Belum ada riwayat perpindahan cabang tercatat.</div>`;
  return `<ul class="history-timeline">
    ${entries.map(h => `
      <li>
        <div class="history-date">${fmtDate(new Date(h.tanggal + 'T00:00:00'))}</div>
        <div class="history-move"><span class="loc-from">${escapeHtml(h.dari)}</span> → <span class="loc-to">${escapeHtml(h.ke)}</span></div>
        ${h.catatan ? `<div class="history-note">${escapeHtml(h.catatan)}</div>` : ''}
      </li>
    `).join('')}
  </ul>`;
}
document.getElementById('modalClose').onclick = () => document.getElementById('modalOverlay').classList.remove('active');
document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') e.currentTarget.classList.remove('active'); };

    reader.onload = (ev) => {
      img.onload = () => {
        const maxSide = 400;
        let { width, height } = img;
        if (width > height && width > maxSide) { height = Math.round(height * maxSide / width); width = maxSide; }
        else if (height > maxSide) { width = Math.round(width * maxSide / height); height = maxSide; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        fotoField.value = dataUrl;
        photoPreview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;

      tanggal_gabung: fd.get('tanggal_gabung'),
      status_nikah: fd.get('status_nikah'),
      jml_anak: fd.get('jml_anak'),
      pendidikan: fd.get('pendidikan'),
      no_rekening: fd.get('no_rekening').trim(),
      nama_rekening: fd.get('nama_rekening').trim(),
      bank: fd.get('bank').trim(),
      nip: fd.get('nip').trim(),
      institusi: fd.get('institusi').trim(),
      email: fd.get('email').trim(),
      kota: fd.get('kota').trim(),
      kecamatan: fd.get('kecamatan').trim(),
      kelurahan: fd.get('kelurahan').trim(),
      emergency_nama: fd.get('emergency_nama').trim(),
      emergency_wa: fd.get('emergency_wa').trim(),
      emergency_hubungan: fd.get('emergency_hubungan').trim(),
      nama_bapak: fd.get('nama_bapak').trim(),
      nama_ibu: fd.get('nama_ibu').trim(),
      foto: fd.get('foto') || '',
    };

    if (editing) {
      const updated = await editEmployee(state.editId, record);
      state.editId = null;
      state.view = 'directory';
      render();
      return;
    }
    const added = await addEmployee(record);
    ev.target.reset();
    const toast = document.getElementById('successToast');
    document.getElementById('successMsg').textContent = `${added.nama} berhasil ditambahkan sebagai karyawan aktif.`;
    toast.classList.add('show');
    renderSidebar();
    setTimeout(() => toast.classList.remove('show'), 4000);
  };
}

function renderSalaryList(jenisFilter) {
  const wrap = document.getElementById('salaryListWrap');
  if (!wrap) return;
  const rows = getAllSalaryRecords(jenisFilter);
  if (!rows.length) {
    wrap.innerHTML = `<div class="empty-state">Belum ada catatan monitoring gaji${jenisFilter ? ` untuk kategori "${escapeHtml(jenisFilter)}"` : ''}.</div>`;
    return;
  }
  const adminCol = isAdmin() ? '<th>Aksi</th>' : '';
  wrap.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr><th>Tanggal</th><th>Karyawan</th><th>Lokasi</th><th>Jenis</th><th>Nominal</th><th>Catatan</th>${adminCol}</tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td class="mono">${fmtDate(new Date(r.tanggal + 'T00:00:00'))}</td>
              <td><strong>${escapeHtml(r.nama)}</strong></td>
              <td>${escapeHtml(r.lokasi)}</td>
              <td><span class="tool-tag ${salaryTypeClass(r.jenis)}">${escapeHtml(r.jenis)}</span></td>
              <td class="mono">${fmtRupiah(r.nominal)}</td>
              <td>${escapeHtml(r.catatan) || '—'}</td>
              ${isAdmin() ? `<td><div style="display:flex; gap:6px;"><button class="btn btn-sm" data-edit-salary="${r.id}|${r.rid}">Edit</button><button class="btn btn-sm btn-danger" data-del-salary="${r.id}|${r.rid}">Hapus</button></div></td>` : ''}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  if (!isAdmin()) return;
  wrap.querySelectorAll('[data-edit-salary]').forEach(btn => {
    btn.onclick = () => {
      const [id, rid] = btn.dataset.editSalary.split('|');
      const rec = (salaryHistory[id] || []).find(r => r.rid === rid);
      if (!rec) return;
      startEditSalary(Number(id), rid, rec);
    };
  });
  wrap.querySelectorAll('[data-del-salary]').forEach(btn => {
    btn.onclick = async () => {
      const [id, rid] = btn.dataset.delSalary.split('|');
      if (!confirm('Hapus catatan monitoring gaji ini?')) return;
      await deleteSalaryRecord(Number(id), rid);
      const activeBtn = document.querySelector('.salary-filter-btn.active');
      renderSalaryList(activeBtn ? activeBtn.dataset.jenis : '');
    };
  });
}

function startEditSalary(id, rid, rec) {
  const form = document.getElementById('salaryAddForm');

function nextAnniversary(e) {
  if (!e._jd) return '—';
  let next = new Date(TODAY.getFullYear(), e._jd.getMonth(), e._jd.getDate());
  if (next < TODAY) next = new Date(TODAY.getFullYear()+1, e._jd.getMonth(), e._jd.getDate());
  return fmtDate(next);
}

function renderMonthLists(monthIdx) {

/* ============ SP Performance view ============ */
function getSPSummary(filterMode, dateFrom, dateTo) {
  const now = new Date(TODAY);
  const y = now.getFullYear(), m = now.getMonth();
  const monthStart = new Date(y, m, 1).toISOString().slice(0, 10);
  const monthEnd = new Date(y, m + 1, 0).toISOString().slice(0, 10);
  let rows = spRecords.slice();
  if (filterMode === 'bulan_ini') {
    rows = rows.filter(r => r.tanggal >= monthStart && r.tanggal <= monthEnd);
  } else if (filterMode === 'custom' && dateFrom && dateTo) {
    rows = rows.filter(r => r.tanggal >= dateFrom && r.tanggal <= dateTo);
  }
  return {
    sp1: rows.filter(r => r.level === 'SP 1').length,
    sp2: rows.filter(r => r.level === 'SP 2').length,
    sp3: rows.filter(r => r.level === 'SP 3').length,
    total: rows.length,
    rows,
  };
}

function getMonthlyChips() {
  const byMonth = {};
  spRecords.forEach(r => {
    const ym = r.tanggal ? r.tanggal.slice(0, 7) : null;
    if (ym) byMonth[ym] = (byMonth[ym] || 0) + 1;
  });
  const months = Object.keys(byMonth).sort().reverse().slice(0, 6);
  const now = TODAY;
  return months.map(ym => {
    const [y, mo] = ym.split('-').map(Number);
    const label = new Date(y, mo - 1, 1).toLocaleDateString('id-ID', { month: 'short', year: 'numeric' });
    const isThisMonth = y === now.getFullYear() && (mo - 1) === now.getMonth();
    return { ym, label, count: byMonth[ym], isThisMonth };
  });
}

function openSPModal(rec) {

          <label>Karyawan</label>
          <select name="emp_id" id="spEmpSelect" required>
            <option value="">— Pilih karyawan —</option>
            ${empOptions}
          </select>
        </div>
        <div class="form-field" style="grid-column:1/-1;">
          <label>Divisi</label>
          <input type="text" name="divisi" id="spDivisiInput" value="${escapeHtml(rec?.divisi||'')}" placeholder="Otomatis dari karyawan" required>
        </div>
        <div class="form-field">
          <label>Level SP</label>
          <select name="level" required>
            <option value="SP 1" ${(!rec||rec.level==='SP 1')?'selected':''}>SP 1</option>
            <option value="SP 2" ${rec?.level==='SP 2'?'selected':''}>SP 2</option>
            <option value="SP 3" ${rec?.level==='SP 3'?'selected':''}>SP 3</option>
          </select>
        </div>
        <div class="form-field">
          <label>Tanggal</label>
          <input type="date" name="tanggal" value="${rec?.tanggal||todayStr}" required>
        </div>
        <div class="form-field">
          <label>Berlaku S/D</label>
          <input type="date" name="berlaku_sd" value="${rec?.berlaku_sd||''}">
        </div>
        <div class="form-field">
          <label>Status</label>
          <select name="status">
            <option value="Aktif" ${(!rec||rec.status==='Aktif')?'selected':''}>Aktif</option>
            <option value="Selesai" ${rec?.status==='Selesai'?'selected':''}>Selesai</option>
          </select>
        </div>
        <div class="form-field" style="grid-column:1/-1;">
          <label>Diberikan Oleh</label>
          <input type="text" name="diberikan_oleh" value="${escapeHtml(rec?.diberikan_oleh||'')}" placeholder="Nama atasan / HRD" required>
        </div>
        <div class="form-field" style="grid-column:1/-1;">
          <label>Alasan / Pelanggaran</label>
          <textarea name="alasan" rows="3" style="width:100%;resize:vertical;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);" placeholder="Deskripsi pelanggaran...">${escapeHtml(rec?.alasan||'')}</textarea>
        </div>
        <div style="grid-column:1/-1; display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" id="spModalCancel" class="btn">Batal</button>
          <button type="submit" class="btn btn-primary">${rec ? 'Simpan Perubahan' : '+ Tambah SP'}</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(modal);
  const closeModal = () => modal.remove();
  document.getElementById('spModalClose').onclick = closeModal;
  document.getElementById('spModalCancel').onclick = closeModal;
  modal.onclick = e => { if (e.target === modal) closeModal(); };
  const empSel = document.getElementById('spEmpSelect');
  const divisiInput = document.getElementById('spDivisiInput');
  empSel.onchange = () => {
    const opt = empSel.selectedOptions[0];
    if (opt && !rec) divisiInput.value = opt.dataset.divisi || '';
  };

    ev.preventDefault();
    const fd = new FormData(ev.target);
    const empId = fd.get('emp_id');
    const emp = EMP.find(e => String(e.id) === String(empId));
    const entry = {
      rid: rec?.rid || genId(),
      emp_id: empId,
      nama: emp?.nama || '',
      divisi: fd.get('divisi').trim(),
      level: fd.get('level'),
      tanggal: fd.get('tanggal'),

    };
    if (rec) {
      const idx = spRecords.findIndex(r => r.rid === rec.rid);

    } else {
      spRecords.push(entry);
    }
    await persistSPRecords();
    closeModal();
    const fm = document.getElementById('spFilterMode')?.value || 'bulan_ini';
    renderSPList(fm, document.getElementById('spDateFrom')?.value, document.getElementById('spDateTo')?.value);
  };
}

function render() {
  if (state.view === 'input' && !isAdmin()) state.view = 'overview';
  renderSidebar();
  if (state.view === 'overview') renderOverview();
  else if (state.view === 'directory') renderDirectory();
  else if (state.view === 'input') renderInput();
  else if (state.view === 'gaji') renderGaji();
  else if (state.view === 'aset') renderAset();
  else if (state.view === 'bagihasil') renderBagiHasil();
  else if (state.view === 'sp') renderSP();
  else if (state.view === 'settings') renderSettings();
}
